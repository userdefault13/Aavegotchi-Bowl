# Calls AarcadeGh-t reusable workflow to auto-post player-facing newsfeed
# and queue an @AarcadeGhst tweet draft for admin approval.
name: Comms auto

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  comms:
    uses: userdefault13/AarcadeGh-t/.github/workflows/comms-auto.yml@main
    with:
      before: ${{ github.event.before }}
      after: ${{ github.sha }}
    secrets:
      COMM_AUTOMATION_SECRET: ${{ secrets.COMM_AUTOMATION_SECRET }}
